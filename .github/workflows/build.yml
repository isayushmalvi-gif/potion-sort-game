name: 🧙 Build Potion Sort AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli

      - name: ➕ Add Android Platform
        run: npx cap add android
        continue-on-error: true

      - name: 🔌 Install AdMob Plugin
        run: |
          npm install @capacitor-community/admob
          npx cap sync android

      - name: 🎨 Generate App Icons
        run: |
          npm install sharp
          cat > resize_icon.js << 'ICONEOF'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const inputFile = 'public/ic_launcher_512.png';
          const resDir = 'android/app/src/main/res';
          if (!fs.existsSync(inputFile)) {
            console.error('Icon not found:', inputFile);
            process.exit(1);
          }
          const sizes = [
            { size: 48,  folder: 'mipmap-mdpi'    },
            { size: 72,  folder: 'mipmap-hdpi'    },
            { size: 96,  folder: 'mipmap-xhdpi'   },
            { size: 144, folder: 'mipmap-xxhdpi'  },
            { size: 192, folder: 'mipmap-xxxhdpi' },
          ];
          const promises = [];
          sizes.forEach(({ size, folder }) => {
            const dir = path.join(resDir, folder);
            fs.mkdirSync(dir, { recursive: true });
            ['ic_launcher.png','ic_launcher_round.png'].forEach(name => {
              promises.push(
                sharp(inputFile)
                  .resize(size, size, { fit: 'cover' })
                  .png()
                  .toFile(path.join(dir, name))
                  .then(() => console.log('✅ ' + folder + '/' + name))
                  .catch(err => console.error('❌ ' + name + ':', err))
              );
            });
          });
          Promise.all(promises)
            .then(() => console.log('All icons done!'))
            .catch(err => { console.error(err); process.exit(1); });
          ICONEOF
          node resize_icon.js
          sleep 3
          echo "✅ Icons generated"

      - name: 📝 Update AndroidManifest for AdMob
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9421094793250690~5768628779"/>\n    </application>|' $MANIFEST
          sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>|' $MANIFEST
          echo "✅ AndroidManifest updated"

      - name: 🔑 Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          cat > android/keystore.properties << EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "✅ Keystore ready"

      - name: ⚙️ Rewrite build.gradle With All Fixes
        run: |
          cat > android/app/build.gradle << 'GRADLEEOF'
          apply plugin: 'com.android.application'

          android {
              namespace "com.ayushmalviya.potionsort"
              compileSdk 35

              defaultConfig {
                  applicationId "com.ayushmalviya.potionsort"
                  minSdk 22
                  targetSdk 35
                  versionCode 2
                  versionName "1.0.1"
              }

              signingConfigs {
                  release {
                      def keystorePropertiesFile = rootProject.file("keystore.properties")
                      def keystoreProperties = new Properties()
                      keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
              }
          }

          repositories {
              flatDir {
                  dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
              }
          }

          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation project(':capacitor-android')
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
              implementation "com.google.android.gms:play-services-ads:23.0.0"
              // ✅ Fix SplashScreen theme error
              implementation "androidx.core:core-splashscreen:1.0.1"
          }
          GRADLEEOF

          echo "✅ build.gradle rewritten"
          cat android/app/build.gradle

      - name: 🎨 Fix SplashScreen Theme
        run: |
          # Create styles.xml with SplashScreen theme
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/styles.xml << 'STYLESEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>

              <style name="Theme.SplashScreen" parent="Theme.SplashScreen.IconBackground">
                  <item name="windowSplashScreenBackground">@color/colorPrimary</item>
                  <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
              </style>
          </resources>
          STYLESEOF

          echo "✅ styles.xml created"

          # Create colors.xml
          cat > android/app/src/main/res/values/colors.xml << 'COLORSEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#040210</color>
              <color name="colorPrimaryDark">#040210</color>
              <color name="colorAccent">#7700ff</color>
          </resources>
          COLORSEOF

          echo "✅ colors.xml created"

      - name: 🔧 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 📦 Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: 📱 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
        continue-on-error: true

      - name: 📱 Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: ⬆️ Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: potion-sort-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: ⬆️ Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: potion-sort-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: ⬆️ Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: potion-sort-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: ✅ Build Complete
        run: |
          echo "=================================="
          echo "  🧙 POTION SORT BUILD COMPLETE!"
          echo "  versionCode: 2"
          echo "  targetSdk:   35"
          echo "=================================="
