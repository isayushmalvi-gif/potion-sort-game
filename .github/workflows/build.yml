name: 🧙 Build Potion Sort AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install NPM Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli

      - name: ➕ Add Android Platform
        run: npx cap add android
        continue-on-error: true

      - name: 🔄 Sync Capacitor
        run: npx cap sync android

      - name: 🔑 Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          cat > android/keystore.properties << EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: ⚙️ Configure Signing
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      def props = new Properties()
                      props.load(new FileInputStream(rootProject.file("keystore.properties")))
                      storeFile file(props['storeFile'])
                      storePassword props['storePassword']
                      keyAlias props['keyAlias']
                      keyPassword props['keyPassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: 🔧 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 📦 Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: 📱 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
        continue-on-error: true

      - name: ⬆️ Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: potion-sort-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: ⬆️ Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: potion-sort-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: ✅ Build Complete
        run: echo "🧙 BUILD COMPLETE!"
