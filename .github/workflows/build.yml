name: 🧙 Build Potion Sort AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli

      - name: ➕ Add Android Platform
        run: npx cap add android
        continue-on-error: true

      - name: 🔌 Install AdMob Plugin
        run: |
          npm install @capacitor-community/admob
          npx cap sync android

      - name: 🎨 Generate App Icons
        run: |
          echo "Installing sharp for image resizing..."
          npm install sharp

          echo "Creating icon resize script..."
          cat > resize_icon.js << 'ICONEOF'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');

          const inputFile = 'public/ic_launcher_512.png';
          const resDir = 'android/app/src/main/res';

          // Check if input file exists
          if (!fs.existsSync(inputFile)) {
            console.error('❌ Icon file not found:', inputFile);
            process.exit(1);
          }

          console.log('✅ Found icon file:', inputFile);

          const sizes = [
            { size: 48,  folder: 'mipmap-mdpi'    },
            { size: 72,  folder: 'mipmap-hdpi'    },
            { size: 96,  folder: 'mipmap-xhdpi'   },
            { size: 144, folder: 'mipmap-xxhdpi'  },
            { size: 192, folder: 'mipmap-xxxhdpi' },
          ];

          // Process all sizes
          const promises = [];

          sizes.forEach(({ size, folder }) => {
            const dir = path.join(resDir, folder);

            // Create directory if not exists
            fs.mkdirSync(dir, { recursive: true });
            console.log('📁 Created dir:', dir);

            // Generate square icon
            const p1 = sharp(inputFile)
              .resize(size, size, { fit: 'cover' })
              .png()
              .toFile(path.join(dir, 'ic_launcher.png'))
              .then(() => console.log(`✅ ${folder}/ic_launcher.png (${size}x${size})`))
              .catch(err => console.error(`❌ ${folder}/ic_launcher.png:`, err));
            promises.push(p1);

            // Generate round icon (same image, Android uses it for circular display)
            const p2 = sharp(inputFile)
              .resize(size, size, { fit: 'cover' })
              .png()
              .toFile(path.join(dir, 'ic_launcher_round.png'))
              .then(() => console.log(`✅ ${folder}/ic_launcher_round.png`))
              .catch(err => console.error(`❌ ${folder}/ic_launcher_round.png:`, err));
            promises.push(p2);

            // Generate foreground icon (for adaptive icons)
            const p3 = sharp(inputFile)
              .resize(size, size, { fit: 'cover' })
              .png()
              .toFile(path.join(dir, 'ic_launcher_foreground.png'))
              .then(() => console.log(`✅ ${folder}/ic_launcher_foreground.png`))
              .catch(err => console.error(`❌ foreground:`, err));
            promises.push(p3);
          });

          // Wait for all to complete
          Promise.all(promises)
            .then(() => {
              console.log('');
              console.log('🎨 All icons generated successfully!');
              console.log('Sizes: 48, 72, 96, 144, 192');
            })
            .catch(err => {
              console.error('Error generating icons:', err);
              process.exit(1);
            });
          ICONEOF

          echo "Running icon generator..."
          node resize_icon.js

          echo "Waiting for files to write..."
          sleep 5

          echo "Verifying icons..."
          ls -la android/app/src/main/res/mipmap-mdpi/
          ls -la android/app/src/main/res/mipmap-xxxhdpi/
          echo "✅ Icons ready!"

      - name: 📝 Update AndroidManifest for AdMob
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          # Add AdMob App ID
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>|' $MANIFEST

          # Add AD_ID permission
          sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>|' $MANIFEST

          echo "✅ AndroidManifest updated"
          cat $MANIFEST

      - name: 🔑 Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          cat > android/keystore.properties << EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "✅ Keystore ready"

      - name: ⚙️ Configure Signing
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      def props = new Properties()
                      props.load(new FileInputStream(rootProject.file("keystore.properties")))
                      storeFile file(props['storeFile'])
                      storePassword props['storePassword']
                      keyAlias props['keyAlias']
                      keyPassword props['keyPassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          echo "✅ Signing configured"

      - name: 🔧 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 📦 Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: 📱 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
        continue-on-error: true

      - name: 📱 Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: ⬆️ Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: potion-sort-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: ⬆️ Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: potion-sort-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: ⬆️ Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: potion-sort-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: ✅ Build Complete
        run: |
          echo "=================================="
          echo "  🧙 POTION SORT BUILD COMPLETE!"
          echo "=================================="
          echo "  Download from Artifacts:"
          echo "  📦 potion-sort-release-aab"
          echo "  📱 potion-sort-debug-apk"
          echo "  📱 potion-sort-release-apk"
          echo "=================================="
