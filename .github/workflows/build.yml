name: 🧙 Build Potion Sort AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli

      - name: ➕ Add Android Platform
        run: npx cap add android
        continue-on-error: true

      - name: 🔌 Install AdMob Plugin
        run: |
          npm install @capacitor-community/admob
          npx cap sync android

      - name: 📱 Update Target SDK to 35
        run: |
          echo "Current build.gradle:"
          cat android/app/build.gradle

          # Update compileSdk
          sed -i 's/compileSdk = 34/compileSdk = 35/g' android/app/build.gradle
          sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' android/app/build.gradle
          sed -i 's/compileSdk = [0-9]*/compileSdk = 35/g' android/app/build.gradle

          # Update targetSdk
          sed -i 's/targetSdk = 34/targetSdk = 35/g' android/app/build.gradle
          sed -i 's/targetSdkVersion 34/targetSdkVersion 35/g' android/app/build.gradle
          sed -i 's/targetSdk = [0-9]*/targetSdk = 35/g' android/app/build.gradle

          echo "✅ Updated build.gradle:"
          cat android/app/build.gradle

      - name: 🎨 Generate App Icons
        run: |
          npm install sharp
          cat > resize_icon.js << 'ICONEOF'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');

          const inputFile = 'public/ic_launcher_512.png';
          const resDir = 'android/app/src/main/res';

          if (!fs.existsSync(inputFile)) {
            console.error('❌ Icon not found:', inputFile);
            process.exit(1);
          }

          const sizes = [
            { size: 48,  folder: 'mipmap-mdpi'    },
            { size: 72,  folder: 'mipmap-hdpi'    },
            { size: 96,  folder: 'mipmap-xhdpi'   },
            { size: 144, folder: 'mipmap-xxhdpi'  },
            { size: 192, folder: 'mipmap-xxxhdpi' },
          ];

          const promises = [];
          sizes.forEach(({ size, folder }) => {
            const dir = path.join(resDir, folder);
            fs.mkdirSync(dir, { recursive: true });
            ['ic_launcher.png','ic_launcher_round.png'].forEach(name => {
              const p = sharp(inputFile)
                .resize(size, size, { fit: 'cover' })
                .png()
                .toFile(path.join(dir, name))
                .then(() => console.log(`✅ ${folder}/${name}`))
                .catch(err => console.error(`❌ ${name}:`, err));
              promises.push(p);
            });
          });

          Promise.all(promises)
            .then(() => console.log('🎨 All icons done!'))
            .catch(err => { console.error(err); process.exit(1); });
          ICONEOF
          node resize_icon.js
          sleep 3
          echo "✅ Icons generated"

      - name: 📝 Update AndroidManifest for AdMob
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9421094793250690~5768628779"/>\n    </application>|' $MANIFEST
          sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>|' $MANIFEST
          echo "✅ AndroidManifest updated"

      - name: 🔑 Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          cat > android/keystore.properties << EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "✅ Keystore ready"

      - name: ⚙️ Configure Signing
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      def props = new Properties()
                      props.load(new FileInputStream(rootProject.file("keystore.properties")))
                      storeFile file(props['storeFile'])
                      storePassword props['storePassword']
                      keyAlias props['keyAlias']
                      keyPassword props['keyPassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          echo "✅ Signing configured"

      - name: 🔧 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 📦 Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: 📱 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
        continue-on-error: true

      - name: 📱 Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: ⬆️ Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: potion-sort-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: ⬆️ Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: potion-sort-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: ⬆️ Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: potion-sort-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: ✅ Build Complete
        run: |
          echo "=================================="
          echo "  🧙 POTION SORT BUILD COMPLETE!"
          echo "=================================="
